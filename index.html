<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF0F5">
<title>Bunny Quotes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Gaegu:wght@700&family=Nunito:wght@600;800;900&family=Pacifico&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF0F5;--surface:#FFFFFF;--text:#3B2A4A;--muted:#8A7898;--accent:#FF6F9E;--accent-text:#FFFFFF;--line:#F1DCE6;--tab:#FFFFFFEE;--card:#FFD6E3;--soft:#FFE6EE;
  color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#241C2E;--surface:#33293F;--text:#F6EEFF;--muted:#B9A9C8;--accent:#FF7FA8;--accent-text:#2A1E33;--line:#463A55;--tab:#2C2337EE;--card:#4A3550;--soft:#3B3047;color-scheme:dark}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
.app{max-width:520px;margin:0 auto;padding:16px 16px 120px}
.app.wide{max-width:820px}
h1{font-family:"Gaegu","Comic Sans MS",cursive;font-size:2.3rem;line-height:1;margin:6px 4px 2px}
.sub{margin:0 4px 14px;color:var(--muted);font-weight:700}
.btn{font:inherit;font-weight:800;font-size:1rem;border-radius:999px;border:3px solid var(--text);padding:12px 14px;cursor:pointer;background:var(--surface);color:var(--text);box-shadow:0 3px 0 var(--text);white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.primary{background:var(--accent);color:var(--accent-text)}
.btn:disabled{opacity:.5;pointer-events:none}
.btn:focus-visible,.tab:focus-visible,.pill:focus-visible,.grid button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.row{display:flex;gap:10px;margin-top:14px}.row .btn{flex:1}
.card{background:var(--card);border:3px solid var(--text);border-radius:28px;padding:10px;box-shadow:0 3px 0 var(--text)}
.preview{position:relative;border-radius:20px;overflow:hidden;background:#fff;min-height:240px;display:grid;place-items:center}
.preview img{width:100%;display:block}
.overlay{position:absolute;left:5%;right:5%;text-align:center;line-height:1.05;text-wrap:balance;pointer-events:none;paint-order:stroke fill}
.overlay.top{top:4%}.overlay.middle{top:50%;transform:translateY(-50%)}.overlay.bottom{bottom:4%}
.loading{color:var(--muted);font-weight:700;padding:30px;text-align:center}
.shimmer{background:linear-gradient(100deg,var(--soft) 30%,var(--surface) 50%,var(--soft) 70%);background-size:300% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-150% 0}}
textarea,input[type=text],input[type=search]{width:100%;font:inherit;font-weight:700;font-size:1rem;border:3px solid var(--text);border-radius:18px;padding:12px 14px;background:var(--surface);color:var(--text)}
textarea{min-height:70px;resize:vertical;font-size:1.1rem}
.label{display:block;font-weight:900;margin:16px 4px 8px;font-size:.95rem}
.pills{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;border:2px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:8px 13px;font:inherit;font-weight:800;cursor:pointer}
.pill[aria-pressed="true"]{border-color:var(--text);background:var(--accent);color:var(--accent-text)}
.fontpill{font-size:1.15rem;padding:6px 14px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{border-color:var(--text);box-shadow:0 0 0 3px var(--accent)}
.seg{display:flex;background:var(--surface);border:3px solid var(--text);border-radius:999px;padding:3px;gap:3px}
.seg button{flex:1;border:0;border-radius:999px;background:none;color:var(--text);font:inherit;font-weight:800;padding:8px 6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-text)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.searchrow{display:flex;gap:8px}.searchrow input{flex:1}
.grid{columns:2;column-gap:10px;margin-top:12px}
@media (min-width:640px){.grid{columns:3}}
.grid button{display:block;width:100%;margin:0 0 10px;padding:0;border:0;border-radius:16px;overflow:hidden;cursor:pointer;break-inside:avoid;min-height:120px}
.grid img{width:100%;display:block}
.note{color:var(--muted);font-weight:700;font-size:.92rem;text-align:center;margin:12px 4px}
.note a{color:inherit}
.progress{margin-top:12px;height:12px;border-radius:999px;background:var(--surface);border:2px solid var(--text);overflow:hidden}
.progress div{height:100%;width:0;background:var(--accent);transition:width .15s}
.setup{background:var(--surface);border-radius:24px;padding:18px;border:2px solid var(--line)}
.sticky{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--bg);padding:8px 0 4px;margin-top:10px}
nav{position:fixed;left:0;right:0;bottom:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--tab);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:2px solid var(--line);z-index:5}
nav .inner{max-width:520px;margin:0 auto;display:flex;gap:6px}
.tab{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-weight:800;font-size:.85rem;padding:8px 4px;border-radius:16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab span{font-size:1.3rem;line-height:1}
.tab[aria-current="page"]{color:var(--text);background:var(--surface)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);max-width:90vw;text-align:center;background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:800;opacity:0;pointer-events:none;transition:.25s;z-index:9}
.toast.show{opacity:1;transform:translate(-50%,0)}
.back{background:none;border:0;color:var(--text);font:inherit;font-weight:900;cursor:pointer;padding:6px 4px;margin-bottom:6px;font-size:1rem}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.shimmer{animation:none}}
</style>
</head>
<body>
<div class="app" id="app">

  <section id="v-setup" hidden>
    <h1>Bunny Quotes</h1>
    <p class="sub">One-time setup</p>
    <div class="setup">
      <label class="label" for="giphyKey">GIPHY key</label>
      <input type="text" id="giphyKey" autocomplete="off" spellcheck="false" placeholder="Paste key here">
      <div class="row"><button class="btn primary" id="saveKeys">Save and start</button></div>
    </div>
  </section>

  <!-- Today -->
  <section id="v-today" hidden>
    <h1>Bunny of the day</h1>
    <p class="sub" id="date"></p>
    <div class="card"><div class="preview" id="todayPrev"></div></div>
    <div class="row">
      <button class="btn" id="todayOther">Another bunny</button>
      <button class="btn" id="todayQuote">Another quote</button>
    </div>
    <div class="row">
      <button class="btn" id="todayEdit">Edit</button>
      <button class="btn primary" id="todaySend">Send</button>
    </div>
    <div class="progress" id="todayProg" hidden><div></div></div>
    <p class="note" id="todayNote"></p>
  </section>

  <!-- Find -->
  <section id="v-find" hidden>
    <h1>Find bunnies</h1>
    <p class="sub">Tap one to put your quote on it</p>
    <div class="searchrow">
      <input type="search" id="q" placeholder="Try: good morning, miss you, birthday" enterkeyhint="search" aria-label="Search bunnies">
      <button class="btn primary" id="go" aria-label="Search">Search</button>
    </div>
    <button class="btn" id="ownBtn" style="width:100%;margin-top:12px">📷 Use my photo</button>
    <input type="file" id="ownFile" accept="image/*" hidden>
    <div class="pills" id="topics" style="margin-top:12px"></div>
    <div class="seg" role="group" aria-label="Type" style="margin-top:6px">
      <button data-kind="gifs" aria-pressed="true">GIFs</button>
      <button data-kind="stickers" aria-pressed="false">Stickers</button>
      <button data-kind="photos" aria-pressed="false">Photos</button>
    </div>
    <div class="grid" id="grid"></div>
    <div id="sentinel" style="height:1px"></div>
    <p class="note" id="findNote"></p>
    <div class="row"><button class="btn" id="more" hidden>Load more</button></div>
    <p class="note">GIFs by <a href="https://giphy.com" target="_blank" rel="noopener">GIPHY</a> · Photos by <a href="https://www.pexels.com" target="_blank" rel="noopener">Pexels</a></p>
  </section>

  <!-- Editor -->
  <section id="v-edit" hidden>
    <button class="back" id="editBack">‹ Back</button>
    <div class="card"><div class="preview" id="editPrev"><img id="editImg" alt="Selected bunny"><div class="overlay" id="overlay"></div></div></div>

    <span class="label">Quote</span>
    <div class="pills" id="cats"></div>
    <textarea id="quoteText" maxlength="120" aria-label="Quote text"></textarea>
    <div class="row" style="margin-top:8px"><button class="btn" id="newQuote">Another quote</button></div>

    <span class="label">Font</span>
    <div class="pills" id="fonts"></div>

    <span class="label">Color</span>
    <div class="swatches" id="colors"></div>

    <div class="two">
      <div><span class="label">Size</span>
        <div class="seg" id="sizes"><button data-size="s">S</button><button data-size="m">M</button><button data-size="l">L</button></div></div>
      <div><span class="label">Place</span>
        <div class="seg" id="places"><button data-pos="top">Top</button><button data-pos="middle">Mid</button><button data-pos="bottom">Bottom</button></div></div>
    </div>

    <div class="sticky">
      <div class="progress" id="prog" hidden><div></div></div>
      <p class="note" id="editNote" style="margin:6px 0"></p>
      <div class="row" style="margin-top:4px">
        <button class="btn" id="saveBtn">Save</button>
        <button class="btn primary" id="sendBtn">Send</button>
      </div>
    </div>
  </section>

  <!-- Settings -->
  <section id="v-settings" hidden>
    <h1>Settings</h1>
    <div class="setup">
      <label class="label" for="giphyKey2">GIPHY key</label>
      <input type="text" id="giphyKey2" autocomplete="off" spellcheck="false">
      <label class="label" for="pexelsKey2">Pexels key (optional, for photos) — <a href="https://www.pexels.com/api/" target="_blank" rel="noopener">get one</a></label>
      <input type="text" id="pexelsKey2" autocomplete="off" spellcheck="false" placeholder="Leave empty to skip photos">
      <div class="row"><button class="btn primary" id="saveKeys2">Save</button></div>
    </div>
  </section>
</div>

<nav aria-label="Main" id="nav" hidden><div class="inner">
  <button class="tab" data-view="today"><span>🐰</span>Today</button>
  <button class="tab" data-view="find"><span>🔍</span>Find</button>
  <button class="tab" data-view="settings"><span>⚙️</span>Settings</button>
</div></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

const KEYWORDS=[["Good morning",/morning|wake|coffee|sunrise/i],["Good night",/night|sleep|bed|dream|tired|nap/i],["Birthday",/birthday|cake|bday/i],["Thank you",/thank/i],["Sorry",/sorry|apolog|forgive/i],["Miss you",/miss|bye/i],["Love",/love|heart|kiss|valentine|cuddle/i],["Cheer up",/hug|sad|cry|cheer|support|you can/i],["Hi",/\bhi\b|hello|hey|wave/i],["Funny",/funny|dance|lol|eat|snack|happy|lazy/i]];
const groupFor=t=>{for(const [g,re] of KEYWORDS)if(re.test(t||""))return g;return null};
const FONTS=[{id:"gaegu",name:"Cute",css:'"Gaegu"',w:700},{id:"fredoka",name:"Round",css:'"Fredoka"',w:600},{id:"pacifico",name:"Script",css:'"Pacifico"',w:400},{id:"patrick",name:"Hand",css:'"Patrick Hand"',w:400},{id:"nunito",name:"Bold",css:'"Nunito"',w:900}];
const COLORS=["#FFFFFF","#FF8FB1","#FFE066","#B7F0C8","#BFD8FF","#3B2A4A","#000000"];
const SIZES={s:.075,m:.095,l:.12};

const $=id=>document.getElementById(id);
const store={get:k=>{try{return localStorage.getItem(k)||""}catch(e){return ""}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const fixQ=t=>t.replace(/[’‘]/g,"'");
const rand=a=>a[Math.floor(Math.random()*a.length)];
const day=Math.floor((Date.now()-new Date().getTimezoneOffset()*60000)/86400000);
const DEFAULT_GIPHY="5yU3DWhRgHorlkkf7c7eFQCW12qWwxa3";
let keys={giphy:store.get("giphyKey")||DEFAULT_GIPHY,pexels:store.get("pexelsKey")};
let style=Object.assign({font:"gaegu",color:"#FFFFFF",size:"m",pos:"bottom"},JSON.parse(store.get("style")||"{}"));
let cat=CATS[0];
let tt;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2800)}

/* ---------- Quote styling (screen + file use the same rules) ---------- */
const fontOf=()=>FONTS.find(f=>f.id===style.font)||FONTS[0];
const isLight=hex=>{const n=parseInt(hex.slice(1),16);return ((n>>16)*299+((n>>8)&255)*587+(n&255)*114)/1000>150};
const outlineOf=c=>isLight(c)?"#3B2A4A":"#FFFFFF";
function styleOverlay(el,widthPx,text){
  const f=fontOf(),size=Math.round(widthPx*SIZES[style.size]);
  el.textContent=fixQ(text);
  el.className="overlay "+style.pos;
  Object.assign(el.style,{fontFamily:`${f.css},"Comic Sans MS",cursive`,fontWeight:f.w,fontSize:size+"px",color:style.color,
    webkitTextStroke:`${Math.max(3,size*.2)}px ${outlineOf(style.color)}`,lineHeight:f.id==="pacifico"?"1.3":"1.08"});
}
function drawQuote(ctx,W,H,text){
  text=fixQ(text).trim(); if(!text)return;
  const f=fontOf(); let size=Math.round(W*SIZES[style.size]),lines;
  const lhMul=f.id==="pacifico"?1.3:1.08;
  const wrap=()=>{ctx.font=`${f.w} ${size}px ${f.css}, "Comic Sans MS", cursive`;const words=text.split(/\s+/),out=[];let line="";
    for(const w of words){const t=line?line+" "+w:w;if(ctx.measureText(t).width>W*.9&&line){out.push(line);line=w}else line=t}out.push(line);return out};
  lines=wrap(); while((lines.length>4||lines.some(l=>ctx.measureText(l).width>W*.92))&&size>12){size-=2;lines=wrap()}
  const lh=size*lhMul,pad=H*.04,total=lh*lines.length;
  let y=style.pos==="top"?pad+size*.85:style.pos==="middle"?(H-total)/2+size*.85:H-pad-total+size*.85;
  ctx.textAlign="center";ctx.lineJoin="round";ctx.miterLimit=2;
  ctx.lineWidth=Math.max(3,size*.2);ctx.strokeStyle=outlineOf(style.color);ctx.fillStyle=style.color;
  for(const l of lines){ctx.strokeText(l,W/2,y);ctx.fillText(l,W/2,y);y+=lh}
}

/* ---------- Views ---------- */
let lastView="today";
function show(v){
  ["setup","today","find","edit","settings"].forEach(x=>$("v-"+x).hidden=x!==v);
  $("nav").hidden=v==="setup"; $("app").classList.toggle("wide",v==="find");
  document.querySelectorAll(".tab").forEach(t=>t.dataset.view===v?t.setAttribute("aria-current","page"):t.removeAttribute("aria-current"));
  if(v!=="edit")lastView=v;
  window.scrollTo(0,0);
}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  const v=t.dataset.view;show(v);
  if(v==="find"&&!results.length)search(true);
  if(v==="today")renderToday();
  if(v==="settings"){$("giphyKey2").value=keys.giphy;$("pexelsKey2").value=keys.pexels}
});
function saveKeys(g,p){keys={giphy:g.trim(),pexels:p.trim()};store.set("giphyKey",keys.giphy);store.set("pexelsKey",keys.pexels)}
$("saveKeys").onclick=()=>{if(!$("giphyKey").value.trim())return toast("Paste your GIPHY key first");saveKeys($("giphyKey").value,"");start()};
$("saveKeys2").onclick=()=>{saveKeys($("giphyKey2").value,$("pexelsKey2").value);toast("Saved");results=[];store.set("todayCache","");loadToday()};

/* ---------- GIPHY / Pexels ---------- */
class ApiErr extends Error{}
async function giphy(endpoint,q,limit,offset){
  const r=await fetch(`https://api.giphy.com/v1/${endpoint}/search?api_key=${encodeURIComponent(keys.giphy)}&q=${encodeURIComponent(q)}&limit=${limit}&offset=${offset}&rating=g&lang=en`);
  if(r.status===401||r.status===403)throw new ApiErr("key"); if(r.status===429)throw new ApiErr("limit"); if(!r.ok)throw new ApiErr("net");
  const j=await r.json();
  return {total:j.pagination?j.pagination.total_count:0,items:j.data.map(d=>({id:d.id,title:d.title||"",kind:"gif",preview:d.images.fixed_width.url,w:+d.images.fixed_width.width,h:+d.images.fixed_width.height,full:(d.images.downsized_medium||d.images.downsized||d.images.original).url}))};
}
async function pexels(q,perPage,pageNo){
  const r=await fetch(`https://api.pexels.com/v1/search?query=${encodeURIComponent(q)}&per_page=${perPage}&page=${pageNo}`,{headers:{Authorization:keys.pexels}});
  if(r.status===401||r.status===403)throw new ApiErr("key"); if(r.status===429)throw new ApiErr("limit"); if(!r.ok)throw new ApiErr("net");
  const j=await r.json();
  return {total:j.total_results||0,items:j.photos.map(p=>({id:"p"+p.id,title:p.alt||"",kind:"photo",preview:p.src.medium,w:p.width,h:p.height,full:p.src.large}))};
}
function errMsg(e,src){
  if(e.message==="key")return `Your ${src} key doesn’t work. Check it in Settings.`;
  if(e.message==="limit")return "You’ve used this hour’s 100 searches. Try again in a little while.";
  return "Can’t reach the internet. Check your connection.";
}

/* ---------- Today: one theme, GIF and quote both match it ---------- */
let today=null; // {day, group, item, quote, total}
function todayGroup(){
  const h=new Date().getHours();
  if(h>=5&&h<11)return "Good morning";
  if(h>=21||h<5)return "Good night";
  const rest=CATS.filter(c=>c!=="Good morning"&&c!=="Good night");
  return rest[day%rest.length];
}
async function loadToday(another){
  const prev=$("todayPrev"); prev.innerHTML='<div class="shimmer" style="position:absolute;inset:0"></div>'; $("todayNote").textContent="";
  try{
    const g=another&&today?today.group:todayGroup();
    const cached=JSON.parse(store.get("todayCache")||"null");
    if(!another&&cached&&cached.day===day&&cached.group===g){today=cached}
    else{
      const max=today&&today.group===g&&today.total?Math.min(today.total,200):40;
      const off=another?Math.floor(Math.random()*max):day%Math.min(max,30);
      const {items,total}=await giphy("gifs",TOPIC_OF[g],1,off);
      if(!items.length)throw new ApiErr("net");
      today={day,group:g,total,item:Object.assign(items[0],{group:g}),quote:another?rand(QUOTES[g]):QUOTES[g][day%QUOTES[g].length]};
      if(!another)store.set("todayCache",JSON.stringify(today));
    }
    $("date").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"})+" · "+today.group;
    renderToday();
  }catch(e){prev.innerHTML=`<p class="loading">${errMsg(e,"GIPHY")}</p>`}
}
function renderToday(){
  if(!today)return;
  const prev=$("todayPrev");
  prev.innerHTML=`<img src="${today.item.full}" alt="Bunny of the day"><div class="overlay"></div>`;
  const draw=()=>styleOverlay(prev.querySelector(".overlay"),prev.clientWidth,today.quote);
  draw(); prev.querySelector("img").onload=draw;
}
$("todayOther").onclick=()=>loadToday(true);
$("todayQuote").onclick=()=>{if(!today)return;const list=QUOTES[today.group];let q;do{q=rand(list)}while(q===today.quote);today.quote=q;renderToday()};
$("todayEdit").onclick=()=>{if(today)openEditor(today.item,today.quote)};
$("todaySend").onclick=()=>{if(today)sendItem(today.item,today.quote,"todayProg","todayNote",["todaySend","todayEdit"])};

/* ---------- Find (bigger pages, endless scroll) ---------- */
const PAGE=50;
let kind="gifs",page=0,query="cute bunny",results=[],seen=new Set(),loadingMore=false,total=0;
$("topics").innerHTML=TOPICS.map(t=>`<button class="pill" aria-pressed="${t==="cute bunny"}">${t}</button>`).join("");
const setTopic=t=>document.querySelectorAll("#topics .pill").forEach(p=>p.setAttribute("aria-pressed",p.textContent===t));
$("topics").onclick=e=>{const b=e.target.closest(".pill");if(!b)return;$("q").value="";query=b.textContent;setTopic(query);search(true)};
function fromBox(){let q=$("q").value.trim();if(!q)return null;if(!/bunn|rabbit|bunny/i.test(q))q="bunny "+q;return q}
$("go").onclick=()=>{const q=fromBox();if(!q)return;query=q;setTopic("");$("q").blur();search(true)};
$("q").onkeydown=e=>{if(e.key==="Enter")$("go").click()};
document.querySelectorAll("[data-kind]").forEach(b=>b.onclick=()=>{kind=b.dataset.kind;document.querySelectorAll("[data-kind]").forEach(x=>x.setAttribute("aria-pressed",x===b));search(true)});
$("more").onclick=()=>search(false);
async function search(reset){
  if(loadingMore)return; loadingMore=true;
  if(reset){page=0;results=[];seen=new Set();total=0;$("grid").innerHTML="";}
  $("findNote").textContent=reset?"":"Loading more…"; $("more").hidden=true;
  if(reset)$("grid").innerHTML=Array.from({length:6},(_,i)=>`<button class="shimmer" style="height:${130+(i%3)*40}px" tabindex="-1" aria-hidden="true"></button>`).join("");
  try{
    let res;
    if(kind==="photos"){
      if(!keys.pexels){$("grid").innerHTML="";$("findNote").innerHTML='Photos need a free Pexels key. Add it in <b>Settings</b>.';loadingMore=false;return}
      res=await pexels(query,PAGE,page+1);
    }else res=await giphy(kind,query,PAGE,page*PAGE);
    if(reset)$("grid").innerHTML="";
    page++; total=res.total;
    const qGroup=groupFor(query);
    const fresh=res.items.filter(it=>!seen.has(it.id)); fresh.forEach(it=>{seen.add(it.id);it.group=qGroup||groupFor(it.title)||"Hi"});
    const start=results.length; results.push(...fresh);
    $("grid").insertAdjacentHTML("beforeend",fresh.map((it,i)=>`<button class="shimmer" data-i="${start+i}" aria-label="Pick this bunny" style="aspect-ratio:${it.w||1}/${it.h||1};min-height:0"><img loading="lazy" src="${it.preview}" alt="" onload="this.parentNode.classList.remove('shimmer')"></button>`).join(""));
    const end=res.items.length<PAGE||(kind!=="photos"&&page*PAGE>=Math.min(total,500));
    $("findNote").textContent=!results.length?"Nothing found. Try another word.":end?`That’s all ${results.length} for “${query}”. Try another topic.`:"";
    $("more").hidden=end;
  }catch(e){if(reset)$("grid").innerHTML="";$("findNote").textContent=errMsg(e,kind==="photos"?"Pexels":"GIPHY");$("more").hidden=!results.length}
  loadingMore=false;
}
$("grid").onclick=e=>{const b=e.target.closest("[data-i]");if(b)openEditor(results[+b.dataset.i])};
/* Own photo or GIF from camera, gallery or files */
let ownUrl=null;
$("ownBtn").onclick=()=>$("ownFile").click();
$("ownFile").onchange=e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f)return;
  if(!f.type.startsWith("image/"))return toast("Pick a photo or GIF");
  if(ownUrl)URL.revokeObjectURL(ownUrl); ownUrl=URL.createObjectURL(f);
  openEditor({kind:f.type==="image/gif"?"gif":"photo",full:ownUrl,own:true});
};
if("IntersectionObserver" in window){
  new IntersectionObserver(es=>{if(es[0].isIntersecting&&!$("v-find").hidden&&!$("more").hidden&&results.length)search(false)},{rootMargin:"600px"}).observe($("sentinel"));
}

/* ---------- Editor ---------- */
let sel=null;
$("cats").innerHTML=CATS.map(c=>`<button class="pill" aria-pressed="${c===cat}">${c}</button>`).join("");
$("cats").onclick=e=>{const b=e.target.closest(".pill");if(!b)return;cat=b.textContent;document.querySelectorAll("#cats .pill").forEach(p=>p.setAttribute("aria-pressed",p===b));setQuote(rand(QUOTES[cat]))};
$("fonts").innerHTML=FONTS.map(f=>`<button class="pill fontpill" data-font="${f.id}" style="font-family:${f.css},cursive;font-weight:${f.w}">${f.name}</button>`).join("");
$("colors").innerHTML=COLORS.map(c=>`<button class="sw" data-color="${c}" style="background:${c}" aria-label="Color ${c}"></button>`).join("");
function syncControls(){
  document.querySelectorAll("[data-font]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.font===style.font));
  document.querySelectorAll("[data-color]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.color===style.color));
  document.querySelectorAll("[data-size]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.size===style.size));
  document.querySelectorAll("[data-pos]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.pos===style.pos));
}
const redraw=()=>styleOverlay($("overlay"),$("editPrev").clientWidth,$("quoteText").value);
function setStyle(k,v){style[k]=v;store.set("style",JSON.stringify(style));syncControls();redraw()}
$("fonts").onclick=e=>{const b=e.target.closest("[data-font]");if(b)setStyle("font",b.dataset.font)};
$("colors").onclick=e=>{const b=e.target.closest("[data-color]");if(b)setStyle("color",b.dataset.color)};
$("sizes").onclick=e=>{const b=e.target.closest("[data-size]");if(b)setStyle("size",b.dataset.size)};
$("places").onclick=e=>{const b=e.target.closest("[data-pos]");if(b)setStyle("pos",b.dataset.pos)};
function setQuote(q){$("quoteText").value=fixQ(q);redraw()}
function openEditor(it,quote){
  sel=it; if(it.group&&QUOTES[it.group]){cat=it.group;document.querySelectorAll("#cats .pill").forEach(p=>p.setAttribute("aria-pressed",p.textContent===cat));const pill=[...document.querySelectorAll("#cats .pill")].find(p=>p.textContent===cat);if(pill)pill.scrollIntoView({block:"nearest",inline:"center"})} $("editImg").src=it.full; $("editImg").onload=redraw;
  $("quoteText").value=fixQ(quote||rand(QUOTES[cat])); $("editNote").textContent=""; $("prog").hidden=true;
  syncControls(); show("edit"); redraw();
}
$("editBack").onclick=()=>{show(lastView);if(lastView==="today")renderToday()};
$("quoteText").oninput=redraw;
$("newQuote").onclick=()=>{let q;do{q=rand(QUOTES[cat])}while(fixQ(q)===$("quoteText").value&&QUOTES[cat].length>1);setQuote(q)};
window.addEventListener("resize",()=>{if(!$("v-edit").hidden)redraw();if(!$("v-today").hidden&&today)renderToday()});

/* ---------- Build the file with the quote on it ---------- */
async function makeFile(item,text,bar){
  const f=fontOf(); try{await document.fonts.load(`${f.w} 40px ${f.css}`)}catch(e){}
  if(item.kind==="photo"){
    const img=new Image();img.crossOrigin="anonymous";img.src=item.full;await img.decode();
    const k=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
    const ctx=c.getContext("2d");ctx.drawImage(img,0,0,c.width,c.height);drawQuote(ctx,c.width,c.height,text);bar.style.width="100%";
    const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.9));
    return new File([blob],"bunny-quote.jpg",{type:"image/jpeg"});
  }
  const {parseGIF,decompressFrames,GIFEncoder,quantize,applyPalette}=window.GifLib;
  const buf=await (await fetch(item.full)).arrayBuffer();
  const gif=parseGIF(buf),frames=decompressFrames(gif,true);
  const W=gif.lsd.width,H=gif.lsd.height,scale=Math.min(1,480/W),OW=Math.round(W*scale),OH=Math.round(H*scale);
  const full=document.createElement("canvas");full.width=W;full.height=H;const fctx=full.getContext("2d",{willReadFrequently:true});
  const patch=document.createElement("canvas"),pctx=patch.getContext("2d");
  const out=document.createElement("canvas");out.width=OW;out.height=OH;const octx=out.getContext("2d",{willReadFrequently:true});
  const enc=GIFEncoder();
  for(let i=0;i<frames.length;i++){
    const fr=frames[i],{width:w,height:h,left,top}=fr.dims;
    const saved=fr.disposalType===3?fctx.getImageData(0,0,W,H):null;
    patch.width=w;patch.height=h;pctx.putImageData(new ImageData(new Uint8ClampedArray(fr.patch),w,h),0,0);
    fctx.drawImage(patch,left,top);
    octx.fillStyle="#FFFFFF";octx.fillRect(0,0,OW,OH);octx.drawImage(full,0,0,OW,OH);drawQuote(octx,OW,OH,text);
    const data=octx.getImageData(0,0,OW,OH).data,pal=quantize(data,256);
    enc.writeFrame(applyPalette(data,pal),OW,OH,{palette:pal,delay:Math.max(20,fr.delay||100),repeat:0});
    if(fr.disposalType===2)fctx.clearRect(left,top,w,h);
    if(saved)fctx.putImageData(saved,0,0);
    bar.style.width=Math.round((i+1)/frames.length*100)+"%";
    if(i%2===0)await new Promise(r=>setTimeout(r));
  }
  enc.finish();
  return new File([enc.bytes()],"bunny-quote.gif",{type:"image/gif"});
}
async function build(item,text,progId,noteId,btnIds){
  btnIds.forEach(id=>$(id).disabled=true);$(progId).hidden=false;const bar=$(progId).firstElementChild;bar.style.width="0";
  $(noteId).textContent="Writing your quote on it…";
  try{const f=await makeFile(item,text,bar);$(noteId).textContent="";return f}
  catch(e){$(noteId).textContent="Couldn’t write on this one. Try another bunny.";return null}
  finally{btnIds.forEach(id=>$(id).disabled=false);$(progId).hidden=true}
}
function download(file){const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
async function sendItem(item,text,progId,noteId,btnIds){
  const f=await build(item,text,progId,noteId,btnIds);if(!f)return;
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}
  catch(e){if(e&&e.name==="AbortError")return}
  download(f);toast("Saved to Downloads. Attach it in WhatsApp or Messenger.");
}
$("sendBtn").onclick=()=>sendItem(sel,$("quoteText").value,"prog","editNote",["sendBtn","saveBtn"]);
$("saveBtn").onclick=async()=>{const f=await build(sel,$("quoteText").value,"prog","editNote",["sendBtn","saveBtn"]);if(f){download(f);toast("Saved to Downloads")}};

/* ---------- Start ---------- */
$("date").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"});
function start(){if(!keys.giphy){show("setup");return}show("today");loadToday()}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(!$("v-today").hidden&&today)renderToday()});
start();
</script>
